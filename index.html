<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favola</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/index.css">
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <div class="tb-group">
        <button class="primary" id="btn-mic" onclick="toggleMic()"><span class="dot"></span> AVVIA</button>
        <button onclick="clearCaption()">Cancella</button>
      </div>
      <div class="sep"></div>
      <div class="tb-group"><span class="label">Dim</span><button onclick="changeSize(-8)">A-</button><button
          onclick="changeSize(8)">A+</button></div>
      <div class="sep"></div>
      <div class="tb-group"><span class="label">Sfondo</span><select onchange="setTheme(this.value)">
          <option value="">Scuro</option>
          <option value="white">Bianco</option>
          <option value="yellow">Giallo</option>
          <option value="green">Verde</option>
        </select></div>
      <div class="sep"></div>
      <div class="tb-group"><span class="label">Modalita</span><select id="mode" onchange="setMode(this.value)">
          <option value="words">Solo parole</option>
          <option value="images">Parole + immagini</option>
        </select></div>
      <div class="sep"></div>
      <div class="tb-group"><button onclick="togglePanel('images')">Immagini</button><button
          onclick="togglePanel('log')">Log</button><button onclick="toggleFS()">Fullscreen</button></div>
    </div>
    <div id="nosupport">Web Speech API non supportata. Apri in Chrome o Edge.</div>
    <div id="statusbar"><span class="dot" id="sdot" style="color:var(--muted)"></span><span id="stxt">Pronto</span><span
        style="margin-left:auto">it-IT - <span class="hi" id="szlbl">64px</span></span></div>
    <div id="stage">
      <div id="placeholder">Parla per iniziare...</div>
      <div id="caption"></div>
    </div>
  </div>
  <div id="panel">
    <div class="ph"><span id="panel-title">Immagini</span><button onclick="closePanel()">x</button></div>
    <div class="pb" id="panel-body"></div>
    <div class="pf" id="panel-footer"></div>
  </div>

  <script src="assets/index.js"></script>
</body>

</html>
