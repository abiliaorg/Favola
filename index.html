<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favola - Home</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0b0b;
      color: #e9e9e9;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(560px, 92vw);
      background: #151515;
      border: 1px solid #2b2b2b;
      border-radius: 10px;
      padding: 20px;
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 0 16px; color: #9a9a9a; }
    .links { display: grid; gap: 10px; }
    a {
      display: block;
      text-decoration: none;
      color: #0a2a12;
      background: #22c55e;
      border: 1px solid #22c55e;
      border-radius: 8px;
      padding: 10px 12px;
      font-weight: 700;
    }
    a.secondary {
      color: #e9e9e9;
      background: #1f4bff;
      border-color: #1f4bff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Favola</h1>
    <p>Seleziona il modulo da aprire.</p>
    <div class="links">
      <a href="record/index.html">Vai a Record</a>
      <a class="secondary" href="session/index.html">Vai a Session</a>
    </div>
  </main>
</body>
</html>
