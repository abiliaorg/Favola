<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Favola</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="assets/index.css">
</head>

<body>
  <div id="app">
    <div id="toolbar">
      <div class="tb-group" id="tb-session-controls">
        <button class="primary" id="btn-mic" onclick="toggleMic()"><span class="dot"></span> AVVIA</button>
        <button id="btn-clear" onclick="clearCaption()">🧹 Cancella</button>
      </div>
      <div class="sep"></div>
      <div class="tb-group"><span class="label">Dim</span>
        <button onclick="changeSize(-8)">A-</button>
        <button onclick="changeSize(8)">A+</button>
      </div>
      <div class="sep"></div>
      <div class="tb-group">
        <span class="label">Sfondo</span>
        <select onchange="setTheme(this.value)">
          <option value="">Scuro</option>
          <option value="white">Bianco</option>
          <option value="yellow">Giallo</option>
          <option value="green">Verde</option>
        </select>
      </div>
      <div class="sep"></div>
      <div class="tb-group"><span class="label">Modalita</span>
        <select id="mode" onchange="setMode(this.value)">
          <option value="words">Solo parole</option>
          <option value="images">Parole + immagini</option>
        </select>
      </div>
      <div class="sep"></div>
      <div class="tb-group"><span class="label">Righe</span>
        <select id="max-lines" onchange="setMaxLines(this.value)">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>
      <div class="sep"></div>
      <div class="tb-group">
        <button id="btn-screen-rec" onclick="toggleScreenRecMode()">⏺ REC SCHERMO OFF</button>
      </div>
      <div class="sep"></div>
      <div class="tb-group">
        <button id="btn-video-add" onclick="pickVideo()">🎬 + Video</button>
        <button id="btn-video-remove" onclick="clearVideo()">🎬 - Video</button>
        <button onclick="exportTrackingDataJson()">💾 Esporta JSON</button>
        <input id="video-file" type="file" accept="video/*" onchange="onVideoSelected(event)" hidden>
      </div>
      <div class="sep"></div>
      <div class="tb-group">
        <button id="btn-outline" onclick="toggleOutlineMode()">▢ Outline OFF</button>
        <button onclick="togglePanel('images')">🖼️ Immagini</button>
        <button onclick="togglePanel('log')">📋 Log</button><button onclick="toggleFS()">⛶ Fullscreen</button>
      </div>
    </div>
    <div id="nosupport">Web Speech API non supportata. Apri in Chrome o Edge.</div>
    <div id="statusbar">
      <span class="dot" id="sdot" style="color:var(--muted)"></span>
      <span id="stxt">Pronto</span>
      <span id="audio-source" class="audio-badge">Sorgente: microfono</span>
      <span id="words-saved" class="audio-badge">Parole salvate: 0</span>
      <span style="margin-left:auto">it-IT - <span class="hi" id="szlbl">64px</span></span>
    </div>
    <div id="stage">
      <div id="video-wrap" class="hidden">
        <video id="story-video" playsinline></video>
      </div>
      <div id="placeholder">Parla per iniziare...</div>
      <div id="caption"></div>
    </div>
  </div>
  <div id="floating-controls">
    <button id="btn-mini-stop" onclick="miniStop()">■ FERMA</button>
    <button id="btn-header-toggle" onclick="toggleHeaderPanel()">+ STRUMENTI</button>
  </div>
  <div id="panel">
    <div class="ph"><span id="panel-title">Immagini</span>
      <button onclick="closePanel()">x</button>
    </div>
    <div class="pb" id="panel-body"></div>
    <div class="pf" id="panel-footer"></div>
  </div>
  <div id="word-outline-layer"></div>
  <div id="face-outline-layer"></div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <script src="assets/index.js"></script>
</body>

</html>
