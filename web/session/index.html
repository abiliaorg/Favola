<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Player</title>
  <link rel="stylesheet" href="assets/index.css" />
</head>
<body>
  <div id="toolbar">
    <div class="tb-group" id="tb-session-controls">
      <button id="btn-start">AVVIA</button>
      <button id="btn-pause">FERMA</button>
    </div>
    <div class="sep"></div>

    <div class="tb-group">
      <span class="label">Partecipante</span>
      <input id="participant" type="text" placeholder="ID" title="Partecipante (obbligatorio per avviare)" autocomplete="off" size="6" />
    </div>
    <div class="tb-group">
      <span class="label">Classe</span>
      <select id="classSel" title="Classe (anno scuola primaria)">
        <option value="" selected>—</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Storia</span>
      <!-- Opzioni popolate da JS in base alla classe (STORIES_BY_CLASS). -->
      <select id="story" title="Storia"></select>
    </div>
    <div class="tb-group">
      <span class="label">Tipologia</span>
      <select id="typology" title="Tipologia">
        <option value="" selected>—</option>
        <option value="text">text</option>
        <option value="images">images</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Sorgenti</span>
      <span id="sources-status" class="status-pill off">non caricate</span>
    </div>
    <div class="sep"></div>

    <div class="tb-group">
      <span class="label">Outline</span>
      <select id="outlineToggle" title="Mostra/nascondi outline parole e volto" disabled>
        <option value="off">OFF</option>
        <option value="on">ON</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Pallino</span>
      <select id="gazeToggle" title="Mostra/nascondi il pallino del gaze (F2)">
        <option value="off" selected>OFF</option>
        <option value="on">ON</option>
      </select>
    </div>
    <div class="tb-group">
      <label title="Esegui la calibrazione a 5 punti prima della storia" style="display:flex;align-items:center;gap:5px;cursor:pointer">
        <input id="calToggle" type="checkbox" checked />
        <span class="label" style="cursor:pointer">Calibrazione</span>
      </label>
    </div>
    <div class="tb-group" id="tb-tobii">
      <span class="label">Tobii</span>
      <span id="tobii-status" class="status-pill off">disconnesso</span>
      <button id="btn-tobii-reconnect" title="Riconnetti al bridge Tobii">&#x21bb;</button>
      <button id="btn-tobii-calibrate" title="Avvia la calibrazione Tobii">Calibra</button>
    </div>
  </div>

  <div id="floating-controls">
    <button id="btn-mini-stop">FERMA</button>
    <button id="btn-tools-toggle">+ STRUMENTI</button>
  </div>

  <div id="stage">
    <div id="videoWrap">
      <video id="video"></video>
      <div id="overlay">
        <div id="gazeDot"></div>
      </div>
    </div>
  </div>

  <div id="calibration" aria-hidden="true"><div id="calDot"></div></div>

  <div id="status">Seleziona partecipante, storia e tipologia.</div>

  <script src="assets/index.js"></script>
</body>
</html>
