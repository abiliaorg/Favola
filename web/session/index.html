<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Player</title>
  <link rel="stylesheet" href="assets/index.css" />
</head>
<body>
  <div id="toolbar">
    <div class="tb-group" id="tb-session-controls">
      <button id="btn-start">AVVIA</button>
      <button id="btn-pause">FERMA</button>
    </div>
    <div class="sep"></div>

    <div class="tb-group">
      <span class="label">Partecipante</span>
      <select id="participant" title="Partecipante"></select>
    </div>
    <div class="tb-group">
      <span class="label">Class</span>
      <select id="classSel" title="Class (elementary year)">
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
        <option value="5">5</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Storia</span>
      <select id="story" title="Storia">
        <option value="carpet">carpet</option>
        <option value="fox">fox</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Tipologia</span>
      <select id="typology" title="Tipologia">
        <option value="text">text</option>
        <option value="images">images</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Sorgenti</span>
      <span id="sources-status" class="status-pill off">non caricate</span>
    </div>
    <div class="sep"></div>

    <div class="tb-group">
      <span class="label">Outline</span>
      <select id="outlineToggle" title="Mostra/nascondi outline parole e volto" disabled>
        <option value="off">OFF</option>
        <option value="on">ON</option>
      </select>
    </div>
    <div class="tb-group">
      <span class="label">Step occhi</span>
      <input id="gazeStep" type="number" value="20" min="1" max="120" title="Step random walk del pallino quando Tobii e' offline" />
    </div>
    <div class="tb-group" id="tb-tobii">
      <span class="label">Tobii</span>
      <span id="tobii-status" class="status-pill off">disconnesso</span>
      <button id="btn-tobii-reconnect" title="Riconnetti al bridge Tobii">&#x21bb;</button>
    </div>
  </div>

  <div id="floating-controls">
    <button id="btn-mini-stop">FERMA</button>
    <button id="btn-tools-toggle">+ STRUMENTI</button>
  </div>

  <div id="stage">
    <div id="videoWrap">
      <video id="video"></video>
      <div id="overlay">
        <div id="gazeDot"></div>
      </div>
    </div>
  </div>

  <div id="status">Seleziona partecipante, storia e tipologia.</div>

  <script src="assets/index.js"></script>
</body>
</html>
